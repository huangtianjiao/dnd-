# AIDM 后端 CI — PR 和 push 到 dev 时运行 pytest + ruff
name: AIDM CI

on:
  pull_request:
    paths:
      - "aidm/**"
      - ".github/workflows/aidm-ci.yml"
  push:
    branches: ["dev"]
    paths:
      - "aidm/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aidm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aidm/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Test (pytest)
        run: pytest tests/ --tb=short

  # ★ review#7: 前端 CI（typecheck + 静态导出构建）
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aidm/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aidm/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (static export)
        run: npm run build

  # ★ review#7: 规则门禁（CoverageManifest CI 确认 + mutation 信号）
  rules-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aidm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aidm/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Coverage CI gate (P1-08)
        run: python scripts/run_cov_gate.py

      # 改造方案 §13.2: 规则一致性矩阵最小 CI 输出（规则可追溯，登记即门禁）
      - name: RuleConformanceMatrix gate (CON-001)
        run: python scripts/run_conformance_report.py --check
